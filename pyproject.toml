[project]
name = "agentic-review-gate"
version = "0.1.0"
description = "Webhook-triggered, LangGraph-based AI review agent with an eval-gated CI pipeline, HITL approval, and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jkelly-dev1" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langfuse = ["langfuse>=2.0"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
